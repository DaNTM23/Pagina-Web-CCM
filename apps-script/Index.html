<style>
  :root{
    /* Paleta extraída directamente del logo CCM */
    --azul-vivo: #23a9e1;    /* azul exacto del logo */
    --verde-vivo: #bcd63f;   /* verde/lima exacto del logo */
    --naranja: #fbb22f;      /* naranja exacto del logo */
    --naranja-oscuro: #e69705;
    --azul: #187095;         /* variante oscura del azul, para texto/botones legibles */
    --verde: #64962c;        /* variante oscura del verde, para texto/botones legibles */
    --gris: #f5f7f9;
    --texto: #16213a;
    --borde: #e2e6ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--gris);
    color: var(--texto);
  }
  header.hero{
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255,255,255,.9), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(255,255,255,.7), transparent 55%),
      repeating-linear-gradient(118deg, rgba(255,255,255,.65) 0px, rgba(255,255,255,.65) 2px, transparent 2px, transparent 34px),
      repeating-linear-gradient(28deg, rgba(20,40,60,.035) 0px, rgba(20,40,60,.035) 1px, transparent 1px, transparent 26px),
      linear-gradient(160deg, #eef1f4 0%, #f8f9fb 45%, #eceff2 100%);
    color: var(--texto);
    padding: 44px 20px 50px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; top:-56px; left:-56px;
    width:170px; height:170px; border-radius:50%;
    border: 24px solid var(--naranja); opacity:.9;
  }
  header.hero::after{
    content:"";
    position:absolute; bottom:-30px; right:-30px;
    width:110px; height:110px; border-radius:50%;
    border: 16px solid var(--azul-vivo); opacity:.8;
  }
  .logo-card{
    display:inline-block;
    margin-bottom: 10px;
    position: relative;
  }
  .logo-card img{ display:block; width: 138px; height:auto; margin: 0 auto; }
  header.hero h1{ margin:0 0 8px; font-size: 1.95rem; font-weight:800; letter-spacing:-0.01em; color: var(--azul); position: relative; }
  header.hero p{ margin:0 auto; max-width: 520px; color:#5b6b7a; font-size: 1.02rem; line-height:1.55; position: relative; }

  .contenedor{ max-width: 900px; margin: 24px auto 40px; padding: 0 16px; position: relative; z-index: 2; }

  .paso{
    display:flex; align-items:center; gap:10px;
    margin: 26px 4px 10px;
    font-weight:700; color: var(--azul); font-size:.95rem;
  }
  .paso.primer-paso{ margin-top: 0; }
  .paso .num{
    width:26px; height:26px; border-radius:50%;
    background: var(--azul); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:.85rem; flex-shrink:0;
  }

  .tabs{ display:flex; gap:8px; background:#fff; border-radius: 14px; padding:8px; box-shadow: 0 1px 2px rgba(15,35,50,.04), 0 10px 28px rgba(15,35,50,.08); }
  .tab-btn{
    flex:1; border:none; background:transparent; padding:14px 8px;
    font-size:.95rem; font-weight:600; color:#7a8794; border-radius:10px;
    cursor:pointer; transition: all .2s; font-family:inherit;
  }
  .tab-btn.activo{ background: linear-gradient(135deg, var(--azul-vivo), var(--azul)); color:#fff; box-shadow: 0 4px 12px rgba(24,112,149,.3); }
  .nivel-desc{ text-align:center; color:#5b6b7a; margin: 18px 4px 6px; font-size:.95rem; }

  .cursos-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:14px; margin-top:16px; }
  .curso-card{
    background:#fff; border:1px solid var(--borde); border-radius:12px;
    padding:16px 18px; cursor:pointer; transition: all .15s;
    text-align:left; width:100%; font-family:inherit;
  }
  .curso-card:hover{ border-color: var(--naranja); box-shadow: 0 4px 14px rgba(0,0,0,.07); transform: translateY(-2px); }
  .curso-card:focus-visible{ outline: 3px solid var(--azul-vivo); outline-offset:2px; }
  .curso-card.seleccionado{ border-color: var(--naranja); background: #fff8ec; }
  .curso-card.cerrado{
    cursor: not-allowed; background: #f7f7f8; color:#a3acb4;
    opacity:.85;
  }
  .curso-card.cerrado:hover{ border-color: var(--borde); box-shadow:none; transform:none; }
  .curso-card.cerrado h3{ color:#9aa5ae; }
  .badge-cerrado{
    display:inline-block; background:#eceff1; color:#6b7680;
    font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px;
    margin-bottom:4px;
  }
  .curso-card h3{ margin:0 0 4px; font-size:1.02rem; color: var(--azul); }
  .curso-card span{ font-size:.82rem; color:#7a8794; }
  .orden-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; background: var(--gris); color:#5b6b7a;
    font-size:.72rem; font-weight:700; margin-right:6px; flex-shrink:0;
  }
  .ruta-sugerida{
    background: #eef6ff; border-left: 4px solid var(--azul);
    padding: 12px 16px; border-radius: 8px; font-size:.85rem;
    color:#2d4257; margin: 4px 4px 16px; line-height:1.5;
  }
  .badge-check{ float:right; display:none; color: var(--verde); font-weight:bold; }
  .curso-card.seleccionado .badge-check{ display:inline; }

  section.form-section{ background:#fff; border-radius: 14px; padding: 26px 22px; margin-top: 10px; box-shadow: 0 1px 2px rgba(15,35,50,.04), 0 10px 28px rgba(15,35,50,.08); }
  section.form-section h2{ margin-top:0; color: var(--azul); font-size:1.2rem; }
  .seleccion-actual{ background: var(--gris); border-left: 4px solid var(--naranja); padding: 10px 14px; border-radius: 8px; font-size:.9rem; margin-bottom: 18px; }

  label{ display:block; font-size:.85rem; font-weight:600; margin: 14px 0 6px; color:#3d4b58; }
  input[type=text], input[type=tel], input[type=email], select{
    width:100%; padding: 11px 12px; border-radius:8px; border:1px solid var(--borde);
    font-size:.95rem; background:#fbfcfd; font-family:inherit;
  }
  input:focus, select:focus{ outline:none; border-color: var(--azul-vivo); box-shadow: 0 0 0 3px rgba(35,169,225,.18); }

  .datos-bancarios{ background: var(--gris); border-radius:10px; padding:14px 16px; font-size:.88rem; line-height:1.8; margin-top:8px; }
  .fila-dato{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .btn-copiar{
    border:1px solid var(--borde); background:#fff; color: var(--azul);
    font-size:.75rem; padding:4px 10px; border-radius:6px; cursor:pointer; font-weight:600;
  }
  .btn-copiar:hover{ background: var(--azul); color:#fff; }
  .nota-pago{ margin-top:10px; font-size:.82rem; color:#5b6b7a; }

  .file-drop{
    border: 2px dashed var(--borde); border-radius:10px; padding: 18px; text-align:center;
    font-size:.88rem; color:#7a8794; margin-top:8px; cursor:pointer;
  }
  .file-drop.tiene-archivo{ border-color: var(--verde); color: #3d7a1f; background:#f2f9ec; }
  .ayuda-archivo{ font-size:.75rem; color:#98a4ae; margin-top:6px; }

  button.enviar{
    width:100%; margin-top: 22px; padding: 14px;
    background: linear-gradient(120deg, var(--naranja), var(--naranja-oscuro));
    color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700;
    letter-spacing:.3px; cursor:pointer; box-shadow: 0 8px 20px rgba(251,178,47,.38);
    font-family:inherit;
  }
  button.enviar:disabled{ opacity:.6; cursor:not-allowed; }

  .estado-msg{ margin-top:14px; padding:12px 14px; border-radius:8px; font-size:.9rem; display:none; }
  .estado-msg.ok{ display:block; background:#e5f6ea; color:#1e6b34; }
  .estado-msg.error{ display:block; background:#fbe7e7; color:#a12a2a; }

  .tarjeta-exito{
    display:none; margin-top:14px; background:#fff; border:1px solid #cdeed9;
    border-radius:12px; padding:18px 20px; box-shadow: 0 1px 2px rgba(15,35,50,.04), 0 10px 24px rgba(15,35,50,.08);
  }
  .tarjeta-exito.visible{ display:block; }
  .tarjeta-exito .check{
    width:40px; height:40px; border-radius:50%; background: var(--verde); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:1.2rem; margin-bottom:10px;
  }
  .tarjeta-exito h3{ margin:0 0 12px; color:#1e6b34; font-size:1.05rem; }
  .tarjeta-exito .dato{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f0f0f0; font-size:.88rem; }
  .tarjeta-exito .dato:last-child{ border-bottom:none; }
  .tarjeta-exito .dato span:first-child{ color:#7a8794; }
  .tarjeta-exito .dato span:last-child{ font-weight:700; color: var(--texto); }
  .tarjeta-exito p.nota{ margin: 12px 0 0; font-size:.82rem; color:#5b6b7a; }

  .cargando{ text-align:center; padding: 40px 20px; color:#7a8794; }

  .estado-inscripcion{
    display:flex; align-items:center; gap:8px; justify-content:center;
    padding: 10px 16px; border-radius:10px; font-size:.9rem; font-weight:700;
    margin-bottom: 20px;
  }
  .estado-inscripcion.abierto{ background:#e5f6ea; color:#1e6b34; }
  .estado-inscripcion.cerrado{ background:#fbe7e7; color:#a12a2a; }

  .cerrado-card{
    background:#fff; border-radius:14px; padding: 40px 26px; text-align:center;
    box-shadow: 0 1px 2px rgba(15,35,50,.04), 0 10px 28px rgba(15,35,50,.08);
  }
  .cerrado-card .icono{ font-size:2.4rem; margin-bottom:8px; }
  .cerrado-card h2{ color:#a12a2a; margin: 0 0 10px; }
  .cerrado-card p{ color:#5b6b7a; margin: 4px 0; font-size:.95rem; }
  footer{ text-align:center; color:#8a97a3; font-size:.8rem; padding: 20px; }
</style>
</head>

  <h1>Inscripciones — Cursos CCM</h1>
  <p>Elige tu nivel, selecciona tu curso y completa tu inscripción</p>
</header>

<div class="contenedor" id="app">
  <div class="cargando" id="cargando">Cargando cursos disponibles…</div>
</div>

<footer>Inscripciones CCM · tus datos se guardan de forma privada para control de inscripciones<br>¿Ya estás inscrito? <a id="linkHistorial" href="#" target="_top" style="color:#187095;">Consulta tu historial CCM</a></footer>

<script>
  let CATALOGO = null;
  let nivelActivo = 0;
  let cursoSeleccionado = null;
  let archivoBase64 = null;
  let archivoNombre = '';
  let archivoTipo = '';
  const MAX_MB_DEFAULT = 5;
  const TIPOS_ACEPTADOS = ['image/jpeg', 'image/png', 'image/jpg', 'application/pdf'];

  // URL absoluta real de la app, inyectada por Code.gs. Es necesaria porque
  // la página corre dentro de un iframe de Google y los enlaces relativos
  // (como "?accion=consulta") no resuelven correctamente.
  const URL_APP = <?!= urlAppJson ?>;
  document.getElementById('linkHistorial').href = URL_APP + '?accion=consulta';

  // Pide niveles/cursos/datos bancarios al backend: única fuente de verdad.
  google.script.run
    .withSuccessHandler(function(catalogo){
      CATALOGO = catalogo;
      montarApp();
    })
    .withFailureHandler(function(err){
      document.getElementById('cargando').textContent = 'No se pudo cargar la información: ' + err.message;
    })
    .getCatalogo();

  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function formatearFecha(iso){
    const partes = iso.split('-');
    const dia = parseInt(partes[2], 10);
    const mes = MESES[parseInt(partes[1], 10) - 1];
    return dia + ' de ' + mes;
  }

  function montarApp(){
    const app = document.getElementById('app');
    const estado = CATALOGO.estadoInscripciones || { abiertas: true };

    if (!estado.abiertas) {
      app.innerHTML = `
        <div class="estado-inscripcion cerrado">🔒 Inscripciones cerradas</div>
        <div class="cerrado-card">
          <div class="icono">📋</div>
          <h2>Inscripciones cerradas</h2>
          <p>El periodo de inscripción no está activo en este momento.</p>
          ${estado.fechaInicio ? `<p>Estuvieron abiertas del <strong>${formatearFecha(estado.fechaInicio)}</strong> al <strong>${formatearFecha(estado.fechaFin)}</strong>.</p>` : ''}
          <p>Te invitamos a estar atento al próximo periodo de inscripción.</p>
        </div>
      `;
      return;
    }

    app.innerHTML = `
      <div class="estado-inscripcion abierto">🟢 Inscripciones abiertas: del ${formatearFecha(estado.fechaInicio)} al ${formatearFecha(estado.fechaFin)}</div>

      <div class="paso primer-paso"><span class="num">1</span> Selecciona tu nivel</div>
      <div class="tabs" id="tabs"></div>
      <div class="nivel-desc" id="nivelDesc"></div>

      <div class="paso"><span class="num">2</span> Selecciona tu curso</div>
      <div class="ruta-sugerida">🧭 El programa está diseñado para cursarse de manera secuencial, desde <strong>“Identidad”</strong> (Nivel 1) hasta <strong>“Destino”</strong> (Curso 6). Recomendamos seguir este orden para aprovechar al máximo el proceso de formación.</div>
      <div class="cursos-grid" id="cursosGrid"></div>

      <section class="form-section">
        <div class="paso" style="margin-top:0;"><span class="num">3</span> Completa tus datos</div>
        <div class="seleccion-actual" id="seleccionActual">Selecciona un curso arriba para continuar.</div>

        <form id="formInscripcion">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" autocomplete="name" required>

          <label for="telefono">Teléfono / WhatsApp</label>
          <input type="tel" id="telefono" autocomplete="tel" required>

          <label for="correo">Correo electrónico (para tu confirmación)</label>
          <input type="email" id="correo" autocomplete="email" required>

          <div class="paso"><span class="num">4</span> Realiza tu pago y adjunta tu comprobante</div>
          <div class="datos-bancarios" id="datosBancarios"></div>

          <label for="comprobante">Comprobante de pago (imagen o PDF, máx. <span id="maxMb"></span> MB)</label>
          <div class="file-drop" id="fileDrop">
            📎 Toca para adjuntar tu comprobante
            <input type="file" id="comprobante" accept=".jpg,.jpeg,.png,.pdf" style="display:none">
          </div>
          <div class="ayuda-archivo">Formatos aceptados: JPG, PNG o PDF.</div>

          <div class="paso"><span class="num">5</span> Envía tu inscripción</div>
          <div class="nota-pago">Revisa que tus datos y tu comprobante sean correctos antes de enviar.</div>
          <div class="nota-pago">🔒 Tu información se usa únicamente para gestionar tu inscripción.</div>
          <button type="submit" class="enviar" id="btnEnviar">Enviar inscripción</button>
          <div class="estado-msg" id="estadoMsg"></div>
          <div class="tarjeta-exito" id="tarjetaExito"></div>
        </form>
      </section>
    `;

    document.getElementById('maxMb').textContent = CATALOGO.maxArchivoMB || MAX_MB_DEFAULT;
    renderDatosBancarios();
    render();
    activarFormulario();
  }

  function renderDatosBancarios(){
    const d = CATALOGO.datosBancarios || {};
    const el = document.getElementById('datosBancarios');
    function filaSimple(etiqueta, valor){
      if(!valor) return '';
      return `<div class="fila-dato"><span><strong>${etiqueta}:</strong> ${valor}</span></div>`;
    }
    function filaConCopiar(etiqueta, valor){
      if(!valor) return '';
      return `<div class="fila-dato">
        <span><strong>${etiqueta}:</strong> ${valor}</span>
        <button type="button" class="btn-copiar" data-copiar="${valor}">Copiar</button>
      </div>`;
    }
    el.innerHTML =
      filaSimple('Banco', d.banco) +
      filaSimple('Titular', d.titular) +
      filaConCopiar('Cuenta', d.cuenta) +
      filaConCopiar('CLABE', d.clabe) +
      filaSimple('Referencia', d.referencia || 'tu nombre + curso');

    el.querySelectorAll('.btn-copiar').forEach(btn => {
      btn.onclick = () => {
        const texto = btn.getAttribute('data-copiar').replace(/\s+/g,'');
        const original = btn.textContent;
        navigator.clipboard.writeText(texto).then(() => {
          btn.textContent = '¡Copiado!';
          setTimeout(() => btn.textContent = original, 1500);
        }).catch(() => {
          btn.textContent = 'No disponible';
          setTimeout(() => btn.textContent = original, 1500);
        });
      };
    });
  }

  function renderTabs(){
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    CATALOGO.niveles.forEach((n, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab-btn' + (i === nivelActivo ? ' activo' : '');
      b.textContent = n.nombre;
      b.onclick = () => {
        nivelActivo = i;
        cursoSeleccionado = null;
        document.getElementById('seleccionActual').textContent = 'Selecciona un curso arriba para continuar.';
        render();
      };
      tabsEl.appendChild(b);
    });
  }

  function renderCursos(){
    const nivel = CATALOGO.niveles[nivelActivo];
    document.getElementById('nivelDesc').textContent = nivel.descripcion || '';
    const gridEl = document.getElementById('cursosGrid');
    gridEl.innerHTML = '';
    nivel.cursos.forEach((curso, idx) => {
      const nombreCurso = curso.nombre;
      const abierto = curso.abierto !== false;
      const activo = abierto && cursoSeleccionado && cursoSeleccionado.nivel === nivel.nombre && cursoSeleccionado.curso === nombreCurso;

      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'curso-card' + (activo ? ' seleccionado' : '') + (abierto ? '' : ' cerrado');
      card.setAttribute('aria-pressed', activo ? 'true' : 'false');

      if (abierto) {
        card.innerHTML = `<span class="badge-check">✓</span><h3><span class="orden-num">${idx + 1}</span>${nombreCurso}</h3><span>${nivel.nombre} · $${CATALOGO.precioCurso} MXN</span>`;
        card.onclick = () => {
          cursoSeleccionado = { nivel: nivel.nombre, curso: nombreCurso };
          document.getElementById('seleccionActual').innerHTML = `Curso seleccionado: <strong>${nombreCurso}</strong> (${nivel.nombre}) · $${CATALOGO.precioCurso} MXN`;
          render();
        };
      } else {
        const mensaje = curso.mensaje || CATALOGO.mensajeCerradoDefault || 'No disponible por el momento';
        card.disabled = true;
        card.innerHTML = `<span class="badge-cerrado">${mensaje}</span><h3><span class="orden-num">${idx + 1}</span>${nombreCurso}</h3><span>${nivel.nombre}</span>`;
      }
      gridEl.appendChild(card);
    });
  }

  function render(){
    renderTabs();
    renderCursos();
  }

  // Escapa datos que vienen del usuario antes de insertarlos con innerHTML
  // (evita XSS si alguien pone HTML/JS en su nombre, por ejemplo).
  function escapeHtml(texto){
    const div = document.createElement('div');
    div.textContent = texto == null ? '' : texto;
    return div.innerHTML;
  }

  function activarFormulario(){
    const fileDrop = document.getElementById('fileDrop');
    const inputArchivo = document.getElementById('comprobante');
    fileDrop.onclick = () => inputArchivo.click();

    inputArchivo.onchange = () => {
      const f = inputArchivo.files[0];
      if(!f) return;

      const maxMB = CATALOGO.maxArchivoMB || MAX_MB_DEFAULT;
      if (f.size > maxMB * 1024 * 1024) {
        alert('El comprobante no puede superar ' + maxMB + ' MB.');
        inputArchivo.value = '';
        return;
      }
      if (TIPOS_ACEPTADOS.indexOf(f.type) === -1) {
        alert('Solo se aceptan archivos JPG, PNG o PDF.');
        inputArchivo.value = '';
        return;
      }

      archivoNombre = f.name;
      archivoTipo = f.type;
      const reader = new FileReader();
      reader.onload = () => {
        archivoBase64 = reader.result;
        fileDrop.textContent = '✅ ' + f.name;
        fileDrop.classList.add('tiene-archivo');
      };
      reader.readAsDataURL(f);
    };

    const form = document.getElementById('formInscripcion');
    const btnEnviar = document.getElementById('btnEnviar');
    const estadoMsg = document.getElementById('estadoMsg');

    form.onsubmit = function(e){
      e.preventDefault();
      estadoMsg.className = 'estado-msg';
      estadoMsg.textContent = '';

      if(!cursoSeleccionado){
        estadoMsg.className = 'estado-msg error';
        estadoMsg.textContent = 'Por favor selecciona un curso antes de enviar.';
        estadoMsg.scrollIntoView({behavior:'smooth'});
        return;
      }

      if(!archivoBase64){
        estadoMsg.className = 'estado-msg error';
        estadoMsg.textContent = 'Debes adjuntar tu comprobante de pago antes de enviar.';
        document.getElementById('fileDrop').scrollIntoView({behavior:'smooth'});
        return;
      }

      const data = {
        nombre: document.getElementById('nombre').value,
        telefono: document.getElementById('telefono').value,
        correo: document.getElementById('correo').value,
        nivel: cursoSeleccionado.nivel,
        curso: cursoSeleccionado.curso,
        metodoPago: 'Transferencia/Depósito',
        comprobanteBase64: archivoBase64,
        comprobanteNombre: archivoNombre,
        comprobanteTipo: archivoTipo
      };

      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Enviando...';
      const tarjetaExito = document.getElementById('tarjetaExito');
      tarjetaExito.className = 'tarjeta-exito';
      tarjetaExito.innerHTML = '';

      // Guardamos estos datos ANTES del reset del formulario, para mostrarlos en la tarjeta de éxito.
      const nombreEnviado = data.nombre;
      const cursoEnviado = data.curso;
      const nivelEnviado = data.nivel;

      google.script.run
        .withSuccessHandler(function(res){
          btnEnviar.disabled = false;
          btnEnviar.textContent = 'Enviar inscripción';
          if(res.ok){
            estadoMsg.className = 'estado-msg';
            form.reset();
            document.getElementById('fileDrop').textContent = '📎 Toca para adjuntar tu comprobante';
            document.getElementById('fileDrop').classList.remove('tiene-archivo');
            archivoBase64 = null;
            archivoNombre = '';
            archivoTipo = '';
            cursoSeleccionado = null;
            document.getElementById('seleccionActual').textContent = 'Selecciona un curso arriba para continuar.';
            render();

            tarjetaExito.className = 'tarjeta-exito visible';
            tarjetaExito.innerHTML = `
              <div class="check">✓</div>
              <h3>Inscripción recibida</h3>
              <div class="dato"><span>Folio</span><span>${escapeHtml(res.folio)}</span></div>
              <div class="dato"><span>Alumno</span><span>${escapeHtml(nombreEnviado)}</span></div>
              <div class="dato"><span>Curso</span><span>${escapeHtml(cursoEnviado)} (${escapeHtml(nivelEnviado)})</span></div>
              <div class="dato"><span>Monto</span><span>$${CATALOGO.precioCurso} MXN</span></div>
              <p class="nota">Ya quedaste inscrito. Guarda tu folio como comprobante.</p>
            `;
            tarjetaExito.scrollIntoView({behavior:'smooth'});
          } else {
            estadoMsg.className = 'estado-msg error';
            estadoMsg.textContent = 'Hubo un problema: ' + res.error;
            estadoMsg.scrollIntoView({behavior:'smooth'});
          }
        })
        .withFailureHandler(function(err){
          btnEnviar.disabled = false;
          btnEnviar.textContent = 'Enviar inscripción';
          estadoMsg.className = 'estado-msg error';
          estadoMsg.textContent = 'Error de conexión: ' + err.message;
          estadoMsg.scrollIntoView({behavior:'smooth'});
        })
        .registrarInscripcion(data);
    };
  }
</script>
</body>
</html>
